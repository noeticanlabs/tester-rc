[package]
name = "cohbit"
version = "0.1.0"
authors = ["Micheal Ellington <noeticanlabs@noetican.ai>"]
edition = "2021"
description = "The atomic unit of certified computation. A brutally focused transition primitive."
license = "MIT"
repository = "https://github.com/noetican-labs/cohbit-primitive"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
num-rational = { version = "0.4", features = ["serde", "num-bigint"] }
num-bigint = "0.4"
num-traits = "0.2"
arbitrary = { version = "1.3", features = ["derive"] }
thiserror = "1.0"
hex = "0.4"
serde_json = "1.0"

[dev-dependencies]
proptest = "1.2"
rand = "0.8"

[features]
test-utils = []
